<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="site">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <title>Mude sua senha!</title>
     <style>
    .menu-btn {
            font-size: 25px;
            background: white;
            border: 0px solid white;
            cursor: pointer;
        }

        #menu {
            display: none;
        }

        #menu.ativo {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 50px;
            left: 0;
            background: white;
            padding: 15px;
            gap: 10px;
            border: 1px solid #ccc;
        }

        #menu a {
            text-decoration: none;
            color: black;
        }
    
   </style>
</head>
<body>
    <section>
      <header>


    <button class="menu-btn" onclick="abrirMenu()">☰</button>

    <nav id="menu">
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="projetos.html">Projetos</a>
        <a href="contato.html">Contato</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<script>
function abrirMenu() {
    document.getElementById("menu").classList.toggle("ativo");
}
</script>

    
        <section>
      <form id="form-senha">
        <fieldset>
          <legend>Troque de Senha</legend>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email">
          <span class="erro" id="erro-email"></span><br><br>

          <label for="nova-senha">Nova senha:</label>
          <input type="password" id="nova-senha" name="nova-senha">
          <span class="erro" id="erro-nova-senha"></span><br><br>

          <label for="confirma-senha">Confirme a senha:</label>
          <input type="password" id="confirma-senha" name="confirma-senha">
          <span class="erro" id="erro-confirma-senha"></span><br><br>

          <button type="submit">Confirmar</button>
          <p class="sucesso" id="msg-sucesso"></p>
        </fieldset>
      </form>
    </section>

    <script src="senha.js" defer></script>
    
</body>
</html>
