<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="site">
    <link rel="stylesheet" href="style.css">
    <title>Mude sua senha</title>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="abrirMenu()" aria-label="Abrir menu">☰</button>

        <nav id="menu">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="projetos.html">Projetos</a>
            <a href="contato.html">Contato</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <header>
        <h1>Mude sua senha</h1>
    </header>

    <main>
        <form>
            <h2>Troque de Senha</h2>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="nova-senha">Nova senha:</label>
            <input type="password" id="nova-senha" name="nova-senha" required>

            <label for="confirma-senha">Confirme a senha:</label>
            <input type="password" id="confirma-senha" name="confirma-senha" required>

            <button type="submit">Confirmar</button>
        </form>
    </main>

    <script>
        function abrirMenu() {
            document.getElementById("menu").classList.toggle("ativo");
        }
    </script>

</body>
</html>
